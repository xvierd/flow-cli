name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs full history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      # Builds linux/darwin/windows × amd64/arm64 archives (same names that
      # install.sh downloads), writes checksums.txt (sha256), creates the GitHub
      # release and pushes the Homebrew formula to xvierd/homebrew-tap.
      # See .goreleaser.yaml for the one-time tap/secret setup.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained token with Contents: read & write on xvierd/homebrew-tap.
          # When unset, the release still publishes and only the formula upload is skipped.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
