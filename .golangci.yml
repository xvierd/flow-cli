version: "2"

linters:
  enable:
    - govet
    - ineffassign
    - staticcheck
    - errcheck
    - gosec
    - unconvert
    - misspell
  settings:
    staticcheck:
      checks: ["all"]
  exclusions:
    rules:
      # Tests read and write temp-dir fixtures through variable paths.
      - path: _test\.go
        linters: [gosec]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
